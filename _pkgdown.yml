url: https://mufflyt.github.io/mysterymodel/

template:
  bootstrap: 5

reference:
  - title: Specify
    desc: >
      What is being predicted, from which columns, and how the data divides.
      Written down and checked before anything is fitted.
    contents:
      - mm_project
  - title: Prepare
    desc: >
      Eligibility with a ledger that reconciles, and a description that
      carries its denominators.
    contents:
      - mm_clean
      - mm_eda
  - title: Fit and predict
    desc: >
      The model, and risks from exactly that model.
    contents:
      - mm_model
      - mm_predict
  - title: Validate
    desc: >
      Performance on a stated basis, because apparent, bootstrap-corrected
      and held-out numbers are not interchangeable.
    contents:
      - mm_validate
  - title: Present
    desc: >
      A nomogram that is checked against the model it was drawn from.
    contents:
      - mm_nomogram
  - title: Data
    contents:
      - mm_synthetic_cohort
