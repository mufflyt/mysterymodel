url: https://mufflyt.github.io/mysterymodel/

template:
  bootstrap: 5

navbar:
  structure:
    left: [intro, articles, reference, news]

articles:
  - title: Using the package
    navbar: Guides
    contents:
      - mysterymodel
      - validation
      - nomogram
  - title: Worked examples
    navbar: Worked examples
    contents:
      - worked-example

reference:
  - title: Overview
    desc: >
      What the package is for, the order the steps happen in, and what it
      refuses to do quietly.
    contents:
      - mysterymodel-package
  - title: Specify
    desc: >
      What is being predicted, from which columns, and how the data divides.
      Written down and checked before anything is fitted.
    contents:
      - mm_project
  - title: Prepare
    desc: >
      Eligibility with a ledger that reconciles, and a description that
      carries its denominators.
    contents:
      - mm_clean
      - mm_eda
  - title: Fit and predict
    desc: >
      The model, and risks from exactly that model.
    contents:
      - mm_model
      - mm_predict
  - title: Validate
    desc: >
      Performance on a stated basis, because apparent, bootstrap-corrected
      and held-out numbers are not interchangeable.
    contents:
      - mm_validate
  - title: Present
    desc: >
      A nomogram that is checked against the model it was drawn from.
    contents:
      - mm_nomogram
  - title: Data
    contents:
      - mm_synthetic_cohort
